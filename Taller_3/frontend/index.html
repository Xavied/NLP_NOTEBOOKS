<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Translation Service</title>
  <link rel="stylesheet" href="../src/css/styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Translation Service</h1>
    </header>

    <div class="translation-container">
      <!-- Input Panel -->
      <div class="panel input-panel">
        <div class="tabs" id="sourceTabs">
          <button class="tab-btn active" data-lang="en">English</button>
          <button class="tab-btn" data-lang="es">Spanish</button>
          <button class="tab-btn" data-lang="fr">French</button>
        </div>
        <textarea id="inputText" maxlength="255" placeholder="Ingresa un texto (máximo 255 caracteres)"></textarea>
        <p id="charCount">0/255</p>
      </div>

      <!-- Swap Button (as separator) -->
      <div class="swap-container">
        <button id="swapBtn" title="Swap Languages">
          <!-- Inline SVG icon for swap -->
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="#2272FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="swap-icon">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.36-3.36L23 10M1 14l5.64 5.64A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>

      <!-- Output Panel -->
      <div class="panel output-panel">
        <div class="tabs" id="targetTabs">
          <button class="tab-btn" data-lang="en">English</button>
          <button class="tab-btn active" data-lang="es">Spanish</button>
          <button class="tab-btn" data-lang="fr">French</button>
        </div>
        <div id="translatedText" class="translation-display"></div>
      </div>
    </div>

    <!-- Translate Button -->
    <div class="translate-btn-container">
      <button id="translateBtn">Translate</button>
    </div>
  </div>

  <script src="../src/js/main.js"></script>
</body>
</html>
